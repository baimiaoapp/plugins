name: CI

on:
  push:
  pull_request:

jobs:
  verify-baimiao:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/baimiao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack install --global yarn@4.6.0
      - run: yarn install --immutable
      - run: yarn verify
